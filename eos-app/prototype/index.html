<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Quiet list. One horizontal menu, one centered column of hairline lists on an off-white ground; data pages widen. Colors are Sharper Academy brand v5 (paper set). */
:root{
  --bg:#F4F6F7;            /* off-white ground (not a brand token; between paper #fff and glass #eef1f3) */
  --surface:#FFFFFF;       /* paper */
  --ink:#0E1316; --body:#1F2A2F; --muted:#4F5B61;
  --line:#E1E6E8; --line-strong:#C9D1D4;
  --teal-900:#105244; --teal-700:#1A836C; --teal-500:#3FD9B8; --teal-100:#E8FAF6;
  --coral-700:#D7371F; --coral-500:#FF8370; --coral-100:#FFF0EE;
  --amber-700:#956D15; --amber-100:#FFF9EB;
  --sans:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-700);outline-offset:2px}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:600;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600}
h3{font-size:14px;font-weight:600}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:13px;color:var(--muted)}
a{color:inherit}

/* header + menu */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line-strong);
  display:flex;align-items:center;gap:12px 28px;padding-block:18px;padding-left:max(40px, env(safe-area-inset-left,0px));padding-right:max(40px, env(safe-area-inset-right,0px))}
.brand-name{font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;gap:4px 20px;font-size:14px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);text-decoration:none;white-space:nowrap;padding:2px 0}
.nav a:hover{color:var(--ink)}
.nav a.active{color:var(--ink);font-weight:500;box-shadow:0 2px 0 var(--teal-500)}
.nav .count,.nav-sep{display:none}
.masthead .spacer{flex:1}
.meta{font-size:13px;color:var(--muted);white-space:nowrap}

/* page */
.content{max-width:760px;margin:0 auto;padding-block:56px 96px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.content[data-view="scorecard"],.content[data-view="l10"],.content[data-view="home"],.content[data-view="mcp"],.content[data-view="values"]{max-width:1080px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 20px}

/* buttons: text by default, one filled primary per view */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:14px;text-decoration:none}
.btn:hover{color:var(--ink)}
.btn.primary{background:var(--ink);color:#FFFFFF;padding:8px 16px;border-radius:999px;font-weight:500}
.btn.primary:hover{background:var(--body);color:#FFFFFF}
.btn.small{font-size:13px;padding:4px 2px}
.btn[aria-pressed="true"]{color:var(--ink);font-weight:500}

/* sections: no boxes, just a heading and hairlines */
.panel{background:transparent;border:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 0 10px;border-bottom:1px solid var(--line-strong)}
.panel-body{padding:0 0 16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.stat{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.stat .big{font-size:34px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .big small{font-size:16px;color:var(--muted);font-weight:500}
.stat:hover .big{color:var(--teal-900)}
.bar{height:2px;background:var(--line);margin-top:8px}
.bar > i{display:block;height:100%;background:var(--teal-500)}

/* status: dot + word, no fills */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:2px 0;border:0;background:transparent;white-space:nowrap;cursor:default}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
button.pill{cursor:pointer}
button.pill:hover{text-decoration:underline;text-underline-offset:3px}
.s-on_track{color:var(--teal-900)} .s-on_track::before{background:var(--teal-500)}
.s-off_track{color:var(--coral-700)}
.s-done{color:var(--muted)}
.s-not_done{color:var(--muted)}
.tag{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.tag.good{color:var(--teal-900)}
.tag.bad{color:var(--coral-700)}
.tag.warn{color:var(--amber-700)}

.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink);background:var(--line);flex:none}
.owner{font-size:13px;color:var(--muted);white-space:nowrap}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .title{min-width:0;color:var(--ink)}
.row .sub{font-size:13px;color:var(--muted)}
.rock-row{grid-template-columns:minmax(0,1fr) 90px 80px 96px 28px}
.todo-row{grid-template-columns:24px minmax(0,1fr) 90px 80px}
.issue-row{grid-template-columns:28px minmax(0,1fr) 80px auto}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:16px;height:16px;margin:0;accent-color:var(--teal-700);cursor:pointer}
.milestones{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:2px 0 4px}
.milestones label{display:flex;gap:10px;align-items:center;font-size:14px}
.expand{border:0;background:transparent;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:50%}
.expand:hover{background:var(--line);color:var(--ink)}
.rank{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--line-strong)}
.rank.top{border:1.5px solid var(--teal-500);color:var(--ink)}
.actions{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.issue-row .actions,.hl .btn{opacity:.0;transition:opacity .12s}
.issue-row:hover .actions,.issue-row:focus-within .actions,.hl:hover .btn,.hl:focus-within .btn{opacity:1}
@media (hover:none){.issue-row .actions,.hl .btn{opacity:1}}

.tabs{display:flex;gap:18px}
.tabs button{border:0;background:transparent;padding:2px 0;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button.on{color:var(--ink);font-weight:500}

/* scorecard */
.table-wrap{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
.sc th,.sc td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sc th{font-size:12px;font-weight:500;color:var(--muted);border-bottom-color:var(--line-strong)}
.sc th:first-child,.sc td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;padding-left:0;color:var(--ink)}
.sc th:first-child{color:var(--muted)}
.sc td.owner-cell,.sc th.owner-cell{text-align:left}
.sc td.goal{font-family:var(--mono);color:var(--muted);font-size:13px}
.sc td.v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sc td.v.miss{color:var(--coral-700)}
.sc td.v.empty{color:var(--line-strong)}
.sc th.cur{color:var(--ink)}
.sc td.cur{background:var(--surface)}
.sc input{width:70px;text-align:right;font-family:var(--mono);font-size:13px;border:0;border-bottom:1px solid var(--line-strong);padding:2px 0;background:transparent;color:inherit}
.sc input::placeholder{color:var(--line-strong)}
.trend{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.trend i{width:4px;background:var(--line-strong)}
.trend i.hit{background:var(--teal-500)}
.trend i.miss{background:var(--coral-500)}

/* forms: underline inputs */
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.form input[type=text],textarea{border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:10px 0;background:transparent;min-width:0;color:var(--ink)}
.form input[type=text]{flex:1 1 240px;font-size:16px}
.form input[type=text]:focus,textarea:focus{outline:none;border-bottom-color:var(--teal-700)}
::placeholder{color:var(--muted)}
.form select,.owner select{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0}
textarea{width:100%;min-height:64px;resize:vertical}
.solve-box{grid-column:1/-1;background:var(--surface);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}

/* headlines */
.hl{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.hl .text{min-width:0;color:var(--ink)}

/* values / vto */
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px 40px}
.value{display:flex;flex-direction:column;gap:6px;padding:0}
.value .idx{font-family:var(--mono);color:var(--muted);font-size:12px}
.value h3{font-size:20px;letter-spacing:-.01em}
.value p{color:var(--body)}
.value ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.vto{display:grid;grid-template-columns:220px minmax(0,1fr)}
.vto > div{padding:14px 0;border-bottom:1px solid var(--line)}
.vto .k{color:var(--muted);font-size:14px}
.vto .v{color:var(--ink)}

/* L10 */
.agenda{display:flex;flex-direction:column}
.seg{display:grid;grid-template-columns:24px minmax(0,1fr) 60px;gap:10px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;text-align:left;width:100%;color:var(--muted)}
.seg > span:last-child{display:none}
.seg:hover{color:var(--ink)}
.seg.on{color:var(--ink)}
.seg.on b{box-shadow:0 2px 0 var(--teal-500)}
.seg b{font-weight:500}
.seg .n,.seg .mins{font-family:var(--mono);font-size:12px}
.seg .mins{text-align:right}
.l10{display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px;align-items:start}
.timer{font-family:var(--mono);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}

/* MCP */
.tool{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tool code{font-family:var(--mono);font-size:13px;color:var(--ink);word-break:break-word}
.chat{display:flex;flex-direction:column;gap:12px;padding:20px 0}
.msg{max-width:72ch;padding:12px 16px;border-radius:14px;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--ink);color:#FFFFFF}
.msg.ai{background:var(--surface);color:var(--ink)}
.call{font-family:var(--mono);font-size:12.5px;padding:2px 0 2px 16px;border-left:2px solid var(--teal-500);overflow-x:auto;white-space:pre;color:var(--muted)}
.call b{color:var(--ink);font-weight:500}

/* data-model drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:30;background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:-20px 0 60px rgba(14,19,22,.08);overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:18px}
.drawer pre{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--bg);border-radius:10px;padding:14px;overflow-x:auto;margin:0;color:var(--body)}
.drawer .k{color:var(--teal-900);font-weight:500}
.drawer .c{color:var(--muted)}
.drawer h2{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.drawer .q{font-size:14px;padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--bg);font-size:12.5px;color:var(--body);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,8px);background:var(--ink);color:#FFFFFF;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:20px 0;color:var(--muted);font-size:14px}
.foot{font-size:12.5px;color:var(--muted)}

@media (max-width:820px){
  .masthead{flex-wrap:wrap;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px}
  .nav{order:3;flex-basis:100%}
  .content{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:32px 72px;gap:32px}
  .grid-2,.l10{grid-template-columns:minmax(0,1fr);gap:32px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rock-row{grid-template-columns:minmax(0,1fr) auto 28px}
  .rock-row .col-owner,.rock-row .col-due{display:none}
  .todo-row{grid-template-columns:24px minmax(0,1fr) auto}
  .todo-row .col-owner{display:none}
  .issue-row{grid-template-columns:28px minmax(0,1fr)}
  .issue-row .col-owner{display:none}
  .issue-row .actions{grid-column:2;justify-content:flex-start}
  .hl{grid-template-columns:minmax(0,1fr)}
  .tool,.vto{grid-template-columns:minmax(0,1fr)}
  .vto .k{border-bottom:0;padding-bottom:0}
  .meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const avatar = id => { const p=P(id); return `<span class="avatar" title="${esc(p.name)}">${initials(p.name)}</span>`; };
const owner = id => `<span class="owner" title="${esc(P(id).name)}">${esc(P(id).name.split(" ")[0])}</span>`;
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const STATUS_LABEL = {on_track:"On track",off_track:"Off track",done:"Done",not_done:"Not done"};
const STATUS_CYCLE = ["on_track","off_track","done"];
const fmtVal = (m,v) => v==null ? "—" : m.unit==="currency" ? "$"+(v>=1000? (v/1000).toFixed(v%1000?1:0)+"k" : v) : m.unit==="percent" ? v+"%" : String(v);
const fmtGoal = m => `${m.goal_op==">="?"≥":m.goal_op=="<="?"≤":"="} ${fmtVal(m,m.goal)}`;
const hit = (m,v) => v==null ? null : m.goal_op===">=" ? v>=m.goal : m.goal_op==="<=" ? v<=m.goal : v===m.goal;
let uid = 100; const nid = p => p + (++uid);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1800);}

    <div class="col-owner">${owner(r.owner_id)}</div>
    <div class="col-due sub num">Due ${fmtDate(r.due_on)}</div>

function vScorecard(){
  const head=WEEKS.map(w=>`<th class="${w===CUR_WEEK?"cur":""}">${fmtDate(w)}</th>`).join("");
  const body=measurables.map(m=>{
    const cells=m.values.map((v,i)=>{
      const cur=WEEKS[i]===CUR_WEEK, h=hit(m,v);
      if(cur) return `<td class="v cur ${h==null?"empty":h?"hit":"miss"}"><input type="text" inputmode="decimal" id="sc-${m.id}" data-act="sc-input" data-id="${m.id}" value="${v??""}" placeholder="—" title="Enter this week's number" aria-label="${esc(m.name)} this week"></td>`;
      return `<td class="v ${h==null?"empty":h?"hit":"miss"}">${fmtVal(m,v)}</td>`;
    }).join("");
    const trend=m.values.map(v=>{const h=hit(m,v);return `<i class="${h==null?"":h?"hit":"miss"}" style="height:${h==null?4:h?14:8}px"></i>`}).join("");
    return `<tr><td>${esc(m.name)}</td><td class="owner-cell">${owner(m.owner_id)}</td><td class="goal">${fmtGoal(m)}</td>${cells}<td><span class="trend">${trend}</span></td></tr>`;
  }).join("");
  return `<div class="page-head"><div><h1>Scorecard</h1></div>
  <button class="btn primary" data-act="new-measurable">+ Measurable</button></div>
  <section class="panel table-wrap"><table class="sc"><thead><tr><th>Measurable</th><th class="owner-cell">Owner</th><th>Goal</th>${head}<th>Trend</th></tr></thead><tbody>${body}</tbody></table></section>`;
}

}

function todoRow(t){
  const overdue=!t.done && new Date(t.due_on+"T23:59:00")<TODAY;
  return `<div class="row todo-row ${t.done?"done":""}">
    <input type="checkbox" class="check" data-act="todo" data-id="${t.id}" ${t.done?"checked":""} aria-label="Done">
    <div class="title">${esc(t.title)}<div class="sub">${esc(t.source)}</div></div>
    <div class="col-owner">${owner(t.owner_id)}</div>
    <div class="sub num" style="text-align:right">${overdue?`<span class="tag bad">Overdue</span>`:"Due "+fmtDate(t.due_on)}</div>
  </div>`;
}
function vTodos(){
  const list=todos.filter(t=>ui.todoFilter==="all"||!t.done);
  const done=todos.filter(t=>t.done).length;
  return `<div class="page-head"><div><h1>To-dos</h1></div>
  <div class="form"><span class="chip num">${Math.round(done/todos.length*100)}% done · target 90%</span><button class="btn" aria-pressed="${ui.todoFilter==="open"}" data-act="tfilter" data-f="open">Open</button><button class="btn" aria-pressed="${ui.todoFilter==="all"}" data-act="tfilter" data-f="all">All</button></div></div>
  <section class="panel">
    <div class="panel-body"><form class="form" data-form="todo"><input type="text" id="new-todo" placeholder="Add a seven-day commitment" required>
      <select id="new-todo-owner" aria-label="Owner">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button class="btn primary" type="submit">Add</button></form></div>
    <div class="rows" style="border-top:1px solid var(--line)">${list.length?list.map(todoRow).join(""):`<div class="empty">Everything is done.</div>`}</div>
  </section>`;
}

function hlRow(h){
  const s=h.sentiment==="good"?"good":h.sentiment==="bad"?"bad":"";
  return `<div class="hl"><span class="tag ${s}">${h.kind[0].toUpperCase()+h.kind.slice(1)}</span>
    <div class="text">${esc(h.text)}<div class="sub muted" style="font-size:12px">${esc(P(h.author_id).name)} · ${fmtDate(h.at)}</div></div>
    <button class="btn small ghost" data-act="hl-issue" data-id="${h.id}">Drop to Issues</button></div>`;
}
function vHeadlines(){
  return `<div class="page-head"><div><h1>Headlines</h1></div></div>
  <section class="panel"><div class="panel-body"><form class="form" data-form="headline">
    <input type="text" id="new-hl" placeholder="Share a short customer or employee headline" required>
    <select id="new-hl-kind" aria-label="Kind"><option value="customer">Customer</option><option value="employee">Employee</option><option value="general">General</option></select>
    <select id="new-hl-sent" aria-label="Good or bad"><option value="good">Good</option><option value="bad">Bad</option><option value="neutral">Neutral</option></select>
    <button class="btn primary" type="submit">Share</button></form></div>
    <div style="border-top:1px solid var(--line)">${headlines.map(hlRow).join("")}</div></section>`;
}

function vValues(){
  return `<div class="page-head"><div><h1>Core values & V/TO</h1></div><button class="btn">Edit</button></div>
  <div class="values">${values.map((v,i)=>`<article class="panel value"><span class="idx">Value ${i+1}</span><h3>${esc(v.name)}</h3><p style="margin:0">${esc(v.description)}</p><ul>${v.examples.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></article>`).join("")}</div>
  <section class="panel"><div class="panel-head"><h2>Vision/Traction Organizer</h2><span class="tag">v3 · edited Oct 6</span></div>
    <div class="vto">${vto.map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join("")}</div></section>`;
}

let timer={running:false,secs:0,h:null};
function vL10(){
  const seg=L10_SEGMENTS.find(s=>s.key===ui.seg);
  const total=L10_SEGMENTS.reduce((a,s)=>a+s.mins,0);
  let inner="";
  if(seg.view==="scorecard") inner=`<div class="rows">${measurables.map(m=>{const h=hit(m,m.values.at(-1));return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="title">${esc(m.name)}<div class="sub">${esc(P(m.owner_id).name)} · ${fmtVal(m,m.values.at(-1))} vs ${fmtGoal(m)}</div></div><span class="tag ${h?"good":"bad"}">${h?"On":"Off"}</span>${h?"<span></span>":`<button class="btn small" data-act="sc-issue" data-id="${m.id}">Drop to Issues</button>`}</div>`}).join("")}</div>`;
  else if(seg.view==="rocks") inner=`<div class="rows">${rocks.map(r=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="title">${esc(r.title)}<div class="sub">${esc(P(r.owner_id).name)}</div></div><button class="pill s-${r.status}" data-act="cycle-rock" data-id="${r.id}">${STATUS_LABEL[r.status]}</button></div>`).join("")}</div>`;
  else if(seg.view==="values") inner=`<div class="rows">${values.map((v,i)=>`<div class="row" style="grid-template-columns:28px minmax(0,1fr)"><span class="rank top">${i+1}</span><div class="title">${esc(v.name)}<div class="sub">${esc(v.description)}</div></div></div>`).join("")}</div>`;
  else if(seg.view==="headlines") inner=headlines.map(hlRow).join("");
  else if(seg.view==="todos") inner=`<div class="rows">${todos.map(todoRow).join("")}</div>`;
  else if(seg.view==="issues") inner=`<div class="rows">${issues.filter(i=>i.status==="open"&&i.list==="short_term").sort((a,b)=>(a.priority??9)-(b.priority??9)).map(issueRow).join("")}</div>`;
  else if(seg.key==="conclude") inner=`<div class="panel-body" style="display:flex;flex-direction:column;gap:12px">
    <div><h3>New to-dos from this meeting</h3><p class="muted" style="margin:4px 0 0">${todos.filter(t=>t.source.startsWith("Issue")||t.source==="L10 · Nov 3").length} created</p></div>
    <div><label for="cascade"><h3>Cascading messages</h3></label><textarea id="cascade" placeholder="What does the rest of the company need to hear?"></textarea></div>
    <div><h3>Rate the meeting</h3><div class="form" style="margin-top:6px">${people.map(p=>`<span class="owner">${avatar(p.id)}<select id="rate-${p.id}" aria-label="${esc(p.name)} rating">${[10,9,8,7,6,5].map(n=>`<option>${n}</option>`).join("")}</select></span>`).join("")}</div></div>
    <div><button class="btn primary" data-act="end-l10">End meeting</button></div></div>`;
  else inner=`<div class="panel-body"><p style="margin:0">Each person shares one personal and one professional best from the past week.</p></div>`;
  const mm=String(Math.floor(timer.secs/60)).padStart(2,"0"), ss=String(timer.secs%60).padStart(2,"0");
  return `<div class="page-head"><div><h1>L10 meeting</h1></div>
  <div class="form"><span class="timer" id="timer">${mm}:${ss}</span><button class="btn" data-act="timer">${timer.running?"Pause":"Start"}</button></div></div>
  <div class="l10">
    <section class="panel"><div class="panel-head"><h2>Agenda</h2><span class="muted num">${total} min</span></div>
      <div class="agenda">${L10_SEGMENTS.map((s,i)=>`<button class="seg ${s.key===ui.seg?"on":""}" data-act="seg" data-k="${s.key}"><span class="n">${i+1}</span><span><b>${esc(s.name)}</b></span><span class="mins">${s.mins} min</span><span></span></button>`).join("")}</div></section>
    <section class="panel"><div class="panel-head"><h2>${esc(seg.name)}</h2><span class="muted">${esc(seg.note)}</span></div>${inner}</section>
  </div>`;
}

function vMcp(){
  return `<div class="page-head"><div><h1>MCP / Agents</h1></div></div>
  <section class="panel"><div class="panel-head"><h2>Connection</h2><span class="tag good">Draft</span></div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:8px">
      <div class="form"><span class="muted" style="width:90px">Server URL</span><code class="mono">https://eoshub.example.com/mcp</code></div>
      <div class="form"><span class="muted" style="width:90px">Transport</span><span>Streamable HTTP</span></div>
      <div class="form"><span class="muted" style="width:90px">Auth</span><span>OAuth 2.1 (sign in with Google Workspace); acts as you</span></div>
    </div></section>
  <section class="panel"><div class="panel-head"><h2>Tools</h2><span class="muted num">${MCP_TOOLS.length}</span></div>
    <div>${MCP_TOOLS.map(([n,a,d,k])=>`<div class="tool"><code>${esc(n)}(${esc(a)})</code><span>${esc(d)}</span><span class="tag ${k==="write"?"warn":""}">${k}</span></div>`).join("")}</div></section>
  <section class="panel"><div class="panel-head"><h2>Example: Claude preps the L10</h2></div>
    <div class="chat">
      <div class="msg user">Prep me for tomorrow's L10. What's off and what should be in the Top 3?</div>
      <div class="call"><b>get_l10_snapshot</b>({ team: "leadership" })</div>
      <div class="msg ai">Two rocks are off track (Sign 4 retainer clients, Publish 6 case studies). Scorecard misses this week: New qualified leads (35 vs ≥40). One to-do is overdue: Marcus's case study outline. I'd suggest Top 3: lead volume, the thin December pipeline, and QBR ownership. Want me to set that order?</div>
      <div class="msg user">Yes. And log an issue that case study approvals are slow.</div>
      <div class="call"><b>prioritize_issues</b>({ ordered_ids: ["i1","i2","i3"] })
<b>create_issue</b>({ title: "Case study approvals take too long with clients",
              owner: "Marcus Lee", links: { rock_id: "r6" } })</div>
      <div class="msg ai">Done. Top 3 is set and the issue is on the short-term list, linked to Marcus's rock.</div>
    </div></section>`;
}

const RENDER = {home:vHome,rocks:vRocks,scorecard:vScorecard,issues:vIssues,todos:vTodos,headlines:vHeadlines,values:vValues,l10:vL10,mcp:vMcp};

function renderNav(){
  const c=counts(), cur=current(); let g="", html="";
  const badge={rocks:`${c.rocksOn}/${c.rocks}`,scorecard:`${c.scHit}/${c.sc}`,issues:c.issues,todos:c.todosOpen,headlines:headlines.length};
  for(const v of VIEWS){ if(v.group!==g){if(g)html+=`<div class="nav-sep" role="separator"></div>`;g=v.group;}
    html+=`<a href="#${v.key}" class="${v.key===cur?"active":""}"><span>${v.label}</span>${badge[v.key]!=null?`<span class="count">${badge[v.key]}</span>`:""}</a>`; }
  $("#nav").innerHTML=html;
}
function renderDrawer(){
  const d=$("#drawer"), app=$("#app"), btn=$("#dmToggle");
  d.hidden=!ui.drawer; app.classList.toggle("with-drawer",ui.drawer); btn.setAttribute("aria-pressed",ui.drawer);
  if(!ui.drawer) return;
  const m=MODEL[current()];
  d.innerHTML=`<h2>Data model <button class="btn small ghost" data-act="close-drawer" aria-label="Close">✕</button></h2>
    <div><h3>Entities on this screen</h3><div class="form" style="margin-top:6px">${m.entities.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div></div>
    <pre>${m.schema}</pre>
    <div><h3>MCP tools</h3><div class="form" style="margin-top:6px">${m.tools.map(t=>`<span class="chip mono" style="font-size:11.5px">${esc(t)}</span>`).join("")}</div></div>
    <div><h3 style="margin-bottom:6px">Open questions</h3><ol class="q">${m.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
    <p class="muted" style="font-size:12px;margin:0">All entities also carry id, org_id, created_at, updated_at, created_by and source (web | mcp | import).</p>`;
}
function render(){
  $("#qchip").textContent=`Leadership team · Q${QUARTER.q} ${QUARTER.year} · Week ${weekOfQuarter()} of 13`;
  renderNav(); $("#view").dataset.view=current(); $("#view").innerHTML=RENDER[current()](); renderDrawer();
}

/* ---------- actions ---------- */
function addIssue(title,owner_id,link){ issues.push({id:nid("i"),title,owner_id,list:"short_term",priority:null,status:"open",raised_by:"p_ryan",links:link?[link]:[]}); }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==="cycle-rock"){const r=rocks.find(x=>x.id===id);r.status=STATUS_CYCLE[(STATUS_CYCLE.indexOf(r.status)+1)%STATUS_CYCLE.length];toast(`Rock marked ${STATUS_LABEL[r.status].toLowerCase()}`);}
  else if(act==="toggle-rock"){ui.expanded.has(id)?ui.expanded.delete(id):ui.expanded.add(id);}
  else if(act==="ms"){const r=rocks.find(x=>x.id===b.dataset.rock);const m=r.milestones.find(x=>x.id===id);m.done=b.checked;}
  else if(act==="rock-to-issue"){const r=rocks.find(x=>x.id===id);addIssue(`Off track: ${r.title}`,r.owner_id,`Rock: ${r.title}`);toast("Added to Issues");}
  else if(act==="sc-issue"){const m=measurables.find(x=>x.id===id);addIssue(`${m.name} off goal`,m.owner_id,`Measurable: ${m.name}`);toast("Added to Issues");}
  else if(act==="hl-issue"){const h=headlines.find(x=>x.id===id);addIssue(h.text,h.author_id,"Headline");toast("Added to Issues");}
  else if(act==="todo"){const t=todos.find(x=>x.id===id);t.done=b.checked;}
  else if(act==="itab"){ui.issueTab=b.dataset.tab;}
  else if(act==="tfilter"){ui.todoFilter=b.dataset.f;}
  else if(act==="top"){const i=issues.find(x=>x.id===id);const tops=issues.filter(x=>x.priority&&x.status==="open"&&x.id!==id).sort((a,b)=>a.priority-b.priority);
    tops.unshift(i);tops.forEach((x,k)=>x.priority=k<3?k+1:null);toast("Moved into Top 3");}
  else if(act==="move-issue"){const i=issues.find(x=>x.id===id);i.list=i.list==="short_term"?"long_term":"short_term";i.priority=null;toast(i.list==="long_term"?"Moved to long-term":"Moved to this week");}
  else if(act==="solve"){ui.solving=id;}
  else if(act==="cancel-solve"){ui.solving=null;}
  else if(act==="confirm-solve"){const i=issues.find(x=>x.id===id);i.status="solved";i.resolution=$("#res-"+id).value.trim();
    const t=$("#todo-"+id).value.trim(); if(t) todos.push({id:nid("t"),title:t,owner_id:$("#todo-owner-"+id).value,due_on:"2026-11-11",done:false,source:`Issue: ${i.title}`});
    ui.solving=null; issues.filter(x=>x.priority&&x.status==="open").sort((a,b)=>a.priority-b.priority).forEach((x,k)=>x.priority=k+1);
    toast(t?"Solved · to-do created":"Solved");}
  else if(act==="seg"){ui.seg=b.dataset.k;}
  else if(act==="timer"){timer.running=!timer.running; if(timer.running){timer.h=setInterval(()=>{timer.secs++;const el=$("#timer");if(el)el.textContent=String(Math.floor(timer.secs/60)).padStart(2,"0")+":"+String(timer.secs%60).padStart(2,"0");},1000);}else clearInterval(timer.h);}
  else if(act==="end-l10"){clearInterval(timer.h);timer={running:false,secs:0,h:null};toast("Meeting saved with ratings and cascading messages");}
  else if(act==="close-drawer"){ui.drawer=false;try{localStorage.setItem("eoshub.drawer","0")}catch(e){}}
  else if(act==="new-rock"||act==="new-measurable"){toast("Form not built in the prototype");return;}
  else return;
  render();
});
document.addEventListener("change",e=>{
  const el=e.target; if(el.dataset.act!=="sc-input") return;
  const m=measurables.find(x=>x.id===el.dataset.id); const v=el.value.trim()===""?null:Number(el.value.replace(/[^0-9.\-]/g,""));
  m.values[m.values.length-1]=Number.isFinite(v)?v:null; render(); toast("Scorecard updated");
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target.dataset.form;
  if(f==="issue"){const t=$("#new-issue").value.trim(); if(!t) return; addIssue(t,$("#new-issue-owner").value); ui.issueTab="short_term"; toast("Issue added");}
  if(f==="todo"){const t=$("#new-todo").value.trim(); if(!t) return; todos.unshift({id:nid("t"),title:t,owner_id:$("#new-todo-owner").value,due_on:"2026-11-11",done:false,source:"Added in web app"}); toast("To-do added");}
  if(f==="headline"){const t=$("#new-hl").value.trim(); if(!t) return; headlines.unshift({id:nid("h"),kind:$("#new-hl-kind").value,sentiment:$("#new-hl-sent").value,text:t,author_id:"p_ryan",at:"2026-11-04"}); toast("Headline shared");}
  render();
});
$("#dmToggle").addEventListener("click",()=>{ui.drawer=!ui.drawer;try{localStorage.setItem("eoshub.drawer",ui.drawer?"1":"0")}catch(e){} renderDrawer();});
window.addEventListener("hashchange",()=>{ui.solving=null;render();window.scrollTo(0,0);});
render();
</script>
